# Eluxen Carts AI receptionist: the one file to edit.
#
# Everything the receptionist knows about the business lives here: hours,
# booking rules, service area, what it may quote, and how it talks.
# After editing, run the sync (see README.md, "Changing prices and rules").
#
# Prices and durations of bookable services come from Square at call time.
# The `expect_price` values below are only a cross-check: if Square says
# something different, Square wins and the mismatch shows up in your
# call summary email.

business:
  name: Eluxen Carts
  owner: Nick
  phone: "(904) 395-5452"
  website: eluxencarts.com
  timezone: America/New_York

summary_email:
  to: hello@eluxencarts.com
  from: "Eluxen Receptionist <receptionist@eluxencarts.com>"

# First words the caller hears. Florida needs everyone's consent to record,
# so the AI and recording notice must stay in this sentence.
greeting: >-
  Thanks for calling Eluxen Carts. I'm an AI assistant, and this call is
  recorded and transcribed. How can I help you today?

# The voice agent itself. Pushed to Retell by the sync.
voice:
  agent_name: Eluxen Carts receptionist
  voice_id: retell-Cimo       # any voice_id from Retell's voice list
  language: en-US
  max_call_minutes: 15        # hard stop for a single call
  hang_up_after_silence_seconds: 30
  # Words the speech recognition should expect to hear.
  boosted_keywords: [Eluxen, Nocatee, Ponte Vedra, EZGO, Club Car, Yamaha, ICON, Evolution, lithium]

hours:
  open: "09:00"   # earliest appointment start, Eastern time
  close: "19:00"  # appointments must end by this time

booking:
  enabled: true            # false = take messages only, book nothing
  earliest_days_ahead: 1   # 1 = tomorrow at the earliest, never same-day
  buffer_minutes: 30       # clear time required before and after every appointment
  max_days_ahead: 21       # how far out it will look for open times
  offer_count: 3           # how many times to offer the caller

service_area:
  home_zip: "32081"
  free_radius_miles: 10    # straight-line miles from the center of the home ZIP
  trip_fee_dollars: 50     # charged beyond the free radius
  # Only addresses in these postal cities are bookable. Anything else is a message.
  cities:
    - Nocatee
    - Ponte Vedra
    - Ponte Vedra Beach
    - St. Johns
    - Jacksonville
    - Jacksonville Beach
    - St. Augustine
  # Force a single ZIP one way or the other: free, fee, or no (take a message).
  zip_overrides: {}

# Services the AI may book. A Square service is matched when its name contains
# every word in `match` (and none of the words in `not`). Anything in Square
# that is not matched here is NOT bookable by the AI.
services:
  - key: maintenance_electric
    say: Maintenance for an electric cart
    match: [maintenance, electric]
    expect_price: 189
  - key: maintenance_gas
    say: Maintenance for a gas cart
    match: [maintenance, gas]
    expect_price: 219
  - key: diagnostic
    say: Diagnostic visit
    match: [diagnostic]
    expect_price: 99
    note: The 99 dollars is credited toward the repair if they go ahead.
  - key: lithium_check
    say: Lithium battery check
    match: [battery, check]
    expect_price: 99
    note: Book this first for anyone asking about a lithium or lead-acid battery replacement.
  - key: signature_detail_4
    say: Signature detail, 4-seat cart
    match: [signature, "4"]
    expect_price: 149
  - key: signature_detail_6
    say: Signature detail, 6-seat cart
    match: [signature, "6"]
    expect_price: 179
  - key: show_detail_4
    say: Show detail, 4-seat cart
    match: [show, "4"]
    expect_price: 249
  - key: show_detail_6
    say: Show detail, 6-seat cart
    match: [show, "6"]
    expect_price: 279
  - key: cart_transport
    say: Cart transport, local move
    match: [transport]
    expect_price: 150
  - key: holiday_lights
    say: Holiday lights, Parade Ready
    match: [parade, ready]
    not: [power]
    expect_price: 129
  - key: holiday_lights_power
    say: Holiday lights, Parade Ready plus Power
    match: [parade, ready, power]
    expect_price: 229
  - key: led_roof
    say: LED roof lights, installed
    match: [roof]
    not: [underglow]
    expect_price: 199
  - key: led_underglow
    say: Underglow lights, installed
    match: [underglow]
    not: [roof]
    expect_price: 199
  - key: led_roof_underglow
    say: LED roof plus underglow lights, installed
    match: [roof, underglow]
    expect_price: 349
  - key: led_seat_floor
    say: LED seat or floor lights, installed
    match: [seat]
    expect_price: 399
    from_price: true
    note: Say "from 399 dollars". The final price is confirmed at the appointment.
  - key: usb_ports
    say: USB charging ports, installed
    match: [usb]
    not: [power, 12v, hookup]
    expect_price: 79
  - key: power_addon
    say: Power add-on, 12 volt hookup plus 4 USB ports
    match: [power]
    not: [parade, ready]
    expect_price: 100
  - key: lithium_install_customer_battery
    say: Lithium battery install with a battery the customer supplies
    match: [lithium, install]
    expect_price: 349
    note: This is labor only. The customer provides the battery.
  - key: care_plan_visit
    say: Annual Care Plan visit for existing members
    match: [care, plan, visit]
    expect_price: 0
    note: No charge. Only for callers who say they already have an Annual Care Plan.

# Prices the AI may quote but must not book. For these it books a lithium
# battery check first, because Nick confirms voltage and fit before ordering.
quote_only:
  intro: Installed battery prices. Quote them, then book a 99 dollar lithium battery check first.
  rows:
    - name: Value lithium (LiTime, or FLLYROWER at 72 volt)
      prices: { 36V: 1749, 48V: 1899, 72V: 2199 }
    - name: Plus lithium (Vatrer)
      prices: { 36V: 2099, 48V: 2399, 72V: 2899 }
    - name: Premium lithium (Eco Battery)
      prices: { 36V: 2449, 48V: 2999, 72V: 3699 }
    - name: New lead-acid set
      prices: { 36V: 1349, 48V: 1399 }
      note: Not offered for 72 volt carts.

facts:
  - "Annual Care Plan: 349 dollars a year for electric carts, 399 for gas. It includes two maintenance visits a year and 10 percent off labor."
  - Detailing is a waterless wash. No hose or spigot is needed.
  - "Payment is taken at the appointment: Zelle, Venmo, cash, or card in person. Cards have a 3 percent fee. Afterpay is accepted."
  - Lithium batteries typically last 10 years or more. Always say "typically". Never guarantee it.
  - All work is mobile. Nick comes to the customer's home or business.
  - Appointments are available 9 AM to 7 PM, every day, Eastern time.

# Never quote, never book. Take a message and promise a callback.
message_only:
  - Any repair, a cart that will not start, custom work, speed or controller programming, parts pricing
  - Carts for sale, trade-ins, custom builds, fleet or business accounts
  - Warranty questions, complaints, refunds, anything about an existing invoice
  - Anything not listed as a bookable service or a quotable price

# How the AI behaves on the call. Plain text. Edit freely.
instructions: |
  You are the phone receptionist for Eluxen Carts, a mobile golf cart service
  in Ponte Vedra, Florida. Nick is the owner and the only technician. You
  answer when Nick cannot pick up. You are an AI assistant and you have
  already said so in your greeting.

  ## How to talk
  - Short sentences. Plain words. One question at a time.
  - No filler, no sales pressure, no long lists. Offer at most three choices.
  - Say prices and times the way a person would: "one eighty nine", "ten thirty in the morning".
  - Never guess. If you do not know, say so and take a message.
  - Never say a cart is "street legal" or an "LSV".
  - You cannot transfer calls. If the caller is upset, or asks for a person,
    take a message and say Nick will call them back.
  - Never promise a specific callback time. Say "usually the same day".
  - If the caller describes a fire, smoke, a swollen battery or an injury:
    tell them to move away from the cart and call 911 right now. Then take a message.
  - If it is a wrong number or a sales call, be polite, keep it short, and end the call.

  ## Call flow
  1. Find out what the caller needs.
  2. Get the cart's make and model, and whether it is electric or gas.
  3. Get the service address, including the ZIP code.
  4. Call check_service_area with the ZIP code. Follow what it tells you.
     If there is a trip charge, tell the caller the amount before you book.
     If the address is outside the service area, take a message. Do not book.
  5. If the request is a bookable service:
     - Call get_services for the current price. Quote only prices from
       get_services or from the price lists below.
     - Call find_open_slots and offer only the times it returns. Never invent a time.
     - Get the caller's full name and confirm the best callback number.
     - Read back: service, price, any trip charge, date, time, address, name
       and callback number. Ask "Should I book that?"
     - Only after the caller clearly says yes, call create_booking.
     - If create_booking fails, apologize, offer the new times it returns, or take a message.
  6. If the request is not bookable: call take_message with a complete message.
     Tell the caller Nick will call back, usually the same day.
  7. Before you say goodbye, call end_call_summary. Then repeat what happens
     next in one sentence and end the call.

  ## Same-day requests
  You cannot book anything for today. The earliest you can book is tomorrow.
  Say so, and offer the next open times. If the caller still wants today,
  take a message with same_day_request set to true and say Nick will call
  back if he can fit it in today, with no guarantee.

  ## When booking is in request mode
  If find_open_slots or create_booking says the mode is "request", you cannot
  book directly right now. Ask for two or three days and times that work for
  the caller, then call take_message with category "booking_request". Tell
  them Nick will confirm the time, usually the same day.

  ## Battery replacement questions
  You may quote the installed battery prices below. Do not book a battery
  install. Book a lithium battery check first, because Nick confirms the
  cart's voltage and fit before ordering a battery.

  ## Annual Care Plan visits
  Book a Care Plan visit at no charge only if the caller says they are
  already a member. You cannot check membership. Nick will verify it.
